spring:
  application:
    name: french-learning-backend
  datasource:
    url: ${app.database.url}
    username: ${app.database.username}
    password: ${app.database.password}
    hikari:
      maximum-pool-size: ${app.database.maximum-pool-size}
      minimum-idle: ${app.database.minimum-idle}
      connection-timeout: ${app.database.connection-timeout-ms}
      validation-timeout: ${app.database.validation-timeout-ms}
  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-disabled: true
    validate-on-migrate: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        default_batch_fetch_size: 50
  jackson:
    default-property-inclusion: non_null
    time-zone: UTC

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      show-components: never
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db

app:
  database:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    maximum-pool-size: ${DB_MAX_POOL_SIZE:20}
    minimum-idle: ${DB_MIN_IDLE:2}
    connection-timeout-ms: ${DB_CONNECTION_TIMEOUT_MS:30000}
    validation-timeout-ms: ${DB_VALIDATION_TIMEOUT_MS:5000}
  jwt:
    issuer: ${JWT_ISSUER}
    audience: ${JWT_AUDIENCE}
    private-key-path: ${JWT_PRIVATE_KEY_PATH}
    public-key-path: ${JWT_PUBLIC_KEY_PATH}
    access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:15m}
  pagination:
    default-page-size: ${DEFAULT_PAGE_SIZE:20}
    maximum-page-size: ${MAXIMUM_PAGE_SIZE:100}
  bootstrap:
    admin:
      enabled: ${APP_BOOTSTRAP_ADMIN_ENABLED:false}
      email: ${APP_BOOTSTRAP_ADMIN_EMAIL:}
      password: ${APP_BOOTSTRAP_ADMIN_PASSWORD:}

logging:
  level:
    root: INFO
    org.springframework.security: INFO
    org.hibernate.SQL: INFO
