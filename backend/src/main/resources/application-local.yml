spring:
  config:
    activate:
      on-profile: local
  jpa:
    properties:
      hibernate:
        format_sql: true

app:
  database:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/french_learning}
    username: ${DB_USERNAME:french_app}
    password: ${DB_PASSWORD}
    maximum-pool-size: ${DB_MAX_POOL_SIZE:10}
    minimum-idle: ${DB_MIN_IDLE:1}
  jwt:
    issuer: ${JWT_ISSUER:http://localhost:8080}
    audience: ${JWT_AUDIENCE:french-learning-api}
    private-key-path: ${JWT_PRIVATE_KEY_PATH:.local/keys/jwt-private.pem}
    public-key-path: ${JWT_PUBLIC_KEY_PATH:.local/keys/jwt-public.pem}

logging:
  level:
    com.example.frenchlearning: DEBUG
